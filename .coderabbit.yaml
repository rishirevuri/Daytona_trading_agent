# CodeRabbit Configuration for SignalOps
# https://docs.coderabbit.ai/configuration

language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true

# Custom review instructions for trading strategy code
instructions: |
  When reviewing trading strategy code, pay special attention to:

  ## Lookahead Bias Detection
  - Flag any use of future data in backtests (e.g., using close price before market close)
  - Check that indicators only use data available at the time of signal
  - Ensure train/test split is temporal, not random

  ## Data Leakage Patterns
  - Verify no information from test set leaks into training
  - Check that feature engineering doesn't use future values
  - Ensure rolling calculations use proper lookback windows

  ## Transaction Costs
  - Verify commission and slippage are included in backtests
  - Flag unrealistic assumptions (e.g., zero transaction costs)
  - Check for market impact modeling on large positions

  ## Reproducibility
  - Ensure random seeds are fixed for reproducibility
  - Check that all data sources are versioned
  - Verify environment dependencies are pinned

  ## Train/Test Separation
  - Verify proper temporal separation between train and test data
  - Flag any overlapping windows
  - Check for walk-forward validation implementation

path_instructions:
  - path: "packages/core/signalops/strategies/**"
    instructions: |
      This is a trading strategy file. Check for:
      1. Lookahead bias in signal generation
      2. Proper use of historical data only
      3. Transaction cost assumptions
      4. Risk management parameters

  - path: "packages/core/signalops/backtest/**"
    instructions: |
      This is backtesting engine code. Verify:
      1. Proper handling of timestamps
      2. Correct order of operations (signal -> execution)
      3. Realistic fill assumptions
      4. Proper handling of corporate actions

  - path: "packages/core/signalops/data/**"
    instructions: |
      This is data handling code. Check:
      1. Data versioning and checksums
      2. Handling of missing data
      3. Proper datetime handling with timezones
      4. No future data access patterns

early_access: false
