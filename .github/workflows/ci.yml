name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile app.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Test imports
        run: |
          python -c "from flask import Flask; print('Flask OK')"
          python -c "import yfinance; print('yfinance OK')"
          python -c "import pandas; print('pandas OK')"
          python -c "import numpy; print('numpy OK')"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: CI=true npm test -- --runInBand --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t investment-scorer .

      - name: Test container starts
        run: |
          docker run -d --name test-app -p 8080:8080 \
            -e APP_ENV=production \
            -e ADMIN_API_TOKEN=ci-test \
            investment-scorer
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health >/dev/null
          curl -fsS http://localhost:8080/ready >/dev/null
          curl -fsS -H 'X-Admin-Token: ci-test' \
            -X POST http://localhost:8080/api/trading-sim/reset >/dev/null
          docker stop test-app
          docker rm test-app
