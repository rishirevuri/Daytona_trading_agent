services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
    ports:
      - "8082:8080"
      - "3001:3000"
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    command: sleep infinity

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:3000
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
    command: gunicorn --bind 0.0.0.0:8080 --workers 2 --threads 4 --timeout 120 app:app
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    command: npm start

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
